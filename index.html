<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Распределение по группам</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      max-width: 360px;
      width: 100%;
      border: 1px solid #334155;
    }
    h2 {
      font-size: 20px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .number-box {
      width: 130px;
      height: 130px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: 800;
      border-radius: 50%;
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }
    /* Цветовая дифференциация по группам */
    .group-1 { background: #2563eb; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); }
    .group-2 { background: #059669; box-shadow: 0 10px 25px rgba(5, 150, 105, 0.4); }
    .group-3 { background: #d97706; box-shadow: 0 10px 25px rgba(217, 119, 6, 0.4); }

    .desc {
      font-size: 16px;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Сенің тобың</h2>
    <div id="badge" class="number-box">—</div>
    <div id="text" class="desc">Топты анықтау...</div>
  </div>

  <script>
    // Проверяем, генерировалась ли группа ранее в этой вкладке
    let group = sessionStorage.getItem('assigned_group');

    if (!group) {
      // Случайное число от 1 до 2
      group = Math.floor(Math.random() * 2) + 1;
      sessionStorage.setItem('assigned_group', group);
    }

    const badge = document.getElementById('badge');
    const text = document.getElementById('text');

    badge.textContent = group;
    badge.classList.add('group-' + group);
    text.textContent = 'Группа №' + group;
  </script>
</body>
</html>
